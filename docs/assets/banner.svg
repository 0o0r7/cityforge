<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="Forge Fair — commit, play, prove">
  <defs>
    <linearGradient id="ember" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d9701a"/>
      <stop offset="0.55" stop-color="#ff9f45"/>
      <stop offset="1" stop-color="#f4c65a"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6f1e8"/>
      <stop offset="1" stop-color="#d3c8ba"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.42" r="0.55">
      <stop offset="0" stop-color="#ff9f45" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#ff9f45" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#332a23" stroke-width="1" stroke-opacity="0.55"/>
    </pattern>
    <font-family id="sans" family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif"/>
  </defs>

  <rect width="1280" height="320" fill="#0b0908"/>
  <rect width="1280" height="320" fill="url(#grid)"/>
  <rect width="1280" height="320" fill="url(#glow)"/>

  <!-- left: wordmark -->
  <g font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif">
    <text x="72" y="86" fill="#9a8e80" font-size="15" letter-spacing="4.5" font-weight="600">ZKVERIFY AGENT GAMES · 2026</text>
    <text x="70" y="176" fill="url(#ink)" font-size="86" font-weight="800" letter-spacing="-1.5">FORGE FAIR</text>
    <rect x="72" y="200" width="120" height="4" rx="2" fill="url(#ember)"/>
    <text x="72" y="248" fill="#ff9f45" font-size="22" font-weight="600" letter-spacing="0.4">Commit → Play → Prove</text>
    <text x="72" y="282" fill="#9a8e80" font-size="16" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">deterministic replay · Groth16 · zkVerify mainnet</text>
  </g>

  <!-- right: 16-tile ring -->
  <g transform="translate(1050 160)">
    <circle r="132" fill="none" stroke="#332a23" stroke-width="1" stroke-dasharray="3 7"/>
    <g fill="#1f1915" stroke="#463a30" stroke-width="1.5">
      <rect x="-15" y="-150" width="30" height="30" rx="6"/>
      <rect x="44" y="-143" width="30" height="30" rx="6"/>
      <rect x="96" y="-112" width="30" height="30" rx="6"/>
      <rect x="125" y="-64" width="30" height="30" rx="6"/>
      <rect x="133" y="-15" width="30" height="30" rx="6"/>
      <rect x="125" y="34" width="30" height="30" rx="6"/>
      <rect x="96" y="82" width="30" height="30" rx="6"/>
      <rect x="44" y="113" width="30" height="30" rx="6"/>
      <rect x="-15" y="120" width="30" height="30" rx="6"/>
      <rect x="-74" y="113" width="30" height="30" rx="6"/>
      <rect x="-126" y="82" width="30" height="30" rx="6"/>
      <rect x="-155" y="34" width="30" height="30" rx="6"/>
      <rect x="-163" y="-15" width="30" height="30" rx="6"/>
      <rect x="-155" y="-64" width="30" height="30" rx="6"/>
      <rect x="-126" y="-112" width="30" height="30" rx="6"/>
    </g>
    <rect x="-74" y="-143" width="30" height="30" rx="6" fill="#ff9f45" stroke="#ff9f45"/>
    <circle r="52" fill="#17120f" stroke="#332a23" stroke-width="1.5"/>
    <g fill="#f6f1e8">
      <circle cx="-16" cy="-16" r="5"/>
      <circle cx="0" cy="0" r="5" fill="#ff9f45"/>
      <circle cx="16" cy="16" r="5"/>
      <circle cx="16" cy="-16" r="5" fill="#7dd3a0"/>
      <circle cx="-16" cy="16" r="5" fill="#7dd3a0"/>
    </g>
  </g>

  <rect y="317" width="1280" height="3" fill="url(#ember)"/>
</svg>
