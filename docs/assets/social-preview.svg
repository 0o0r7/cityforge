<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-label="Forge Fair — provable settlement for on-chain games">
  <defs>
    <linearGradient id="ember" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d9701a"/>
      <stop offset="0.55" stop-color="#ff9f45"/>
      <stop offset="1" stop-color="#f4c65a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.30" r="0.62">
      <stop offset="0" stop-color="#ff9f45" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ff9f45" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#332a23" stroke-width="1" stroke-opacity="0.5"/>
    </pattern>
  </defs>

  <rect width="1280" height="640" fill="#0b0908"/>
  <rect width="1280" height="640" fill="url(#grid)"/>
  <rect width="1280" height="640" fill="url(#glow)"/>

  <g font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif" text-anchor="middle">
    <text x="640" y="150" fill="#9a8e80" font-size="17" letter-spacing="6" font-weight="600">ZKVERIFY AGENT GAMES · 2026</text>

    <text x="638" y="300" fill="#f6f1e8" font-size="128" font-weight="800" letter-spacing="-3">FORGE FAIR</text>
    <rect x="520" y="330" width="240" height="5" rx="2.5" fill="url(#ember)"/>

    <text x="640" y="392" fill="#ff9f45" font-size="30" font-weight="600" letter-spacing="0.5">Commit → Play → Prove</text>
    <text x="640" y="432" fill="#d3c8ba" font-size="20">A 16-tile property game whose settlement you can verify instead of trusting the house.</text>

    <!-- three layers -->
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="600">
      <rect x="150" y="482" width="300" height="56" rx="10" fill="#17120f" stroke="#463a30"/>
      <text x="300" y="517" fill="#f6f1e8">COMMITTED SEED</text>

      <rect x="490" y="482" width="300" height="56" rx="10" fill="#17120f" stroke="#463a30"/>
      <text x="640" y="517" fill="#f6f1e8">DETERMINISTIC REPLAY</text>

      <rect x="830" y="482" width="300" height="56" rx="10" fill="#17120f" stroke="#ff9f45" stroke-width="1.5"/>
      <text x="980" y="517" fill="#ff9f45">ZKVERIFY MAINNET</text>
    </g>

    <text x="640" y="588" fill="#6f645a" font-size="15" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">Groth16 · 3,312 constraints · payout vector proved before a credit moves</text>
  </g>

  <rect y="637" width="1280" height="3" fill="url(#ember)"/>
</svg>
